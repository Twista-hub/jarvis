<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0} body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.post{position:relative;width:1080px;height:1920px;overflow:hidden;color:#102a40;background:radial-gradient(1000px 800px at 100% 0%,rgba(124,198,240,.6),transparent 60%),radial-gradient(900px 900px at 0% 100%,rgba(22,138,173,.3),transparent 65%),linear-gradient(160deg,#eef8fe 0%,#d6ecfa 55%,#c2e2f6 100%)}
.marke{position:absolute;left:72px;top:110px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:36px;animation:ein .7s ease-out both}

@keyframes hoch{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.handy{position:absolute;width:470px;height:960px;border-radius:66px;background:#0b1620;padding:16px;box-shadow:0 60px 110px -40px rgba(5,20,35,.65)}
.glas{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#f7f7f5} .glas img{width:100%;display:block}
.mitte{left:305px;top:640px;z-index:3;animation:handyM .8s cubic-bezier(.2,.9,.25,1.05) .9s both}
.links{left:20px;top:720px;z-index:2;animation:handyL .8s cubic-bezier(.2,.9,.25,1.05) 4.0s both}
.rechts{right:20px;top:720px;z-index:2;animation:handyR .8s cubic-bezier(.2,.9,.25,1.05) 4.5s both}
@keyframes handyM{from{opacity:0;transform:translateY(300px)}to{opacity:1;transform:none}}
@keyframes handyL{from{opacity:0;transform:translateX(-200px) rotate(-14deg) scale(.86)}to{opacity:1;transform:rotate(-8deg) scale(.86)}}
@keyframes handyR{from{opacity:0;transform:translateX(200px) rotate(14deg) scale(.86)}to{opacity:1;transform:rotate(8deg) scale(.86)}}
.label{position:absolute;padding:14px 24px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid #fff;font-size:28px;font-weight:800;color:#1f5f8b;box-shadow:0 12px 30px -16px rgba(21,50,75,.6);z-index:4}
.l1{left:330px;top:580px;animation:ein .5s ease-out 1.6s both} .l2{left:40px;top:1640px;animation:ein .5s ease-out 4.8s both} .l3{right:40px;top:1640px;animation:ein .5s ease-out 5.2s both}
.ende{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:26px;background:linear-gradient(165deg,#2b84c2 0%,#1f6fa8 50%,#1b5d8f 100%);color:#fff;animation:ende .7s ease-out 8.6s both;z-index:10}
@keyframes ende{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.ende svg{width:200px;height:200px;border-radius:52px;box-shadow:0 30px 60px -24px rgba(0,0,0,.5)}
.ende h2{font-size:76px;font-weight:850;letter-spacing:-.02em;line-height:1.05;max-width:920px}
.ende p{font-size:34px;color:#e3f3fd}
.ende .knopf{margin-top:10px;padding:26px 56px;border-radius:22px;font-size:40px;font-weight:800;color:#15324b;background:rgba(255,255,255,.92);box-shadow:0 18px 36px -16px rgba(0,0,0,.45)}
.ende .klein{font-size:24px;opacity:.85}
</style></head><body><div class="post">
