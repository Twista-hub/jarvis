name = "jarvis-alarm"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Own address (DNS at Cloudflare). The workers.dev address stays reachable during the switch.
# crewtender.eu is the public address of Crewtender (since 03.11.2026); www forwards to it (index.ts).
routes = [
  { pattern = "app.wpdigitalranger.com", custom_domain = true },
  { pattern = "crewtender.eu", custom_domain = true },
  { pattern = "www.crewtender.eu", custom_domain = true },
]

# Uploaded documents and Steckbriefe; a lifecycle rule deletes auftraege/ after 30 days.
[[r2_buckets]]
binding = "DATEN"
bucket_name = "jarvis-auftraege"
jurisdiction = "eu"

[ai]
binding = "AI"

[[workflows]]
name = "jarvis-steckbrief"
binding = "STECKBRIEF"
class_name = "Steckbrief"

[vars]
TAGES_LIMIT = "5"
# Supabase project "jarvis" (Frankfurt); the publishable key is public by design.
SUPABASE_URL = "https://juuuifrcxmitkqudqngq.supabase.co"
SUPABASE_KEY = "sb_publishable_Lp4GwnMS4RK5XcXPwgq28Q_Z5jj-Xcp"

[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.md"]
fallthrough = true

# Secrets (set by .github/workflows/web.yml): ANTHROPIC_API_KEY, TEST_CODE_HASH.
