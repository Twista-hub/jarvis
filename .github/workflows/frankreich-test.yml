# Read only: probes the French open data sources for tenders (BOAMP on Opendatasoft, data.gouv.fr) and prints
# robots.txt, licence information and a few sample records.
name: Frankreich-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Abrufen
        run: |
          D=https://echanges.dila.gouv.fr/OPENDATA/BOAMP
          echo "== 2026/11"; curl -s $D/2026/11/ | grep -oE 'href="[^"?/][^"]*"' | head -20
          f=$(curl -s $D/2026/11/ | grep -oE 'href="[^"?/][^"]*"' | head -1 | cut -d'"' -f2); echo "Datei: $f"
          curl -s -o probe "$D/2026/11/$f"; ls -la probe; file probe
          mkdir x && (tar xzf probe -C x 2>/dev/null || tar xf probe -C x 2>/dev/null || unzip -q probe -d x); find x -type f | head -5; find x -type f | wc -l
          one=$(find x -type f -name '*.xml' | head -1); echo "== $one"; head -c 3000 "$one"; echo
          echo "== Dokumentation"; curl -s $D/Documentation/ | grep -oE 'href="[^"?/][^"]*"' | head
