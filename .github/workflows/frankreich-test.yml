# Read only: probes the French open data sources for tenders (BOAMP on Opendatasoft, data.gouv.fr) and prints
# robots.txt, licence information and a few sample records.
name: Frankreich-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Abrufen
        run: |
          D=https://echanges.dila.gouv.fr/OPENDATA/BOAMP/2026/11/02
          for f in $(curl -s $D/ | grep -oE 'href="[0-9][^"]*\.xml"' | cut -d'"' -f2 | sed -n '1p;40p;80p;120p'); do
            curl -s -o a.xml "$D/$f"
            python3 - <<'PY'
          import re
          s=open("a.xml",encoding="utf-8").read()
          g=re.search(r"<GESTION>.*?</GESTION>",s,re.S)
          print("=====", len(s), "Zeichen")
          print(re.sub(r"\s+"," ",g.group(0))[:1800] if g else "keine GESTION")
          d=re.search(r"<DONNEES>\s*<(\w+)",s); print("DONNEES-Typ:", d.group(1) if d else "?")
          if d and d.group(1)!="EFORMS":
              print(re.sub(r"\s+"," ",s[d.start():d.start()+2500]))
          PY
          done
