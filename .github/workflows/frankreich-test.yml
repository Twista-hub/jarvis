# Read only: probes the French open data sources for tenders (BOAMP on Opendatasoft, data.gouv.fr) and prints
# robots.txt, licence information and a few sample records.
name: Frankreich-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: BOAMP lesen
        run: |
          python3 alarm/boamp.py "$(date +%F)" | head -c 1500
          python3 - <<'PY'
          import sys, collections, datetime
          sys.path.insert(0, "alarm")
          import boamp
          tag = datetime.date.today().isoformat()
          r = boamp.releases(tag)
          print("Aufrufe:", len(r), "mit CPV:", sum(1 for x in r if any("classification" in i for i in x["tender"]["items"])), "mit Frist:", sum(1 for x in r if x["tender"]["tenderPeriod"]))
          print(collections.Counter(x["_boamp"]["famille"] for x in r))
          PY
