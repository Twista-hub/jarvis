# Read only: who visits crewtender.eu, from Cloudflare's own analytics (no tracking of our own, no AI, no database):
# daily totals, countries, referring sites, pages, networks, devices, and the Web Analytics beacon (real browsers only).
name: Zugriffe
on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitraum in Tagen (1–90)"
        default: "30"
permissions:
  contents: read
jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare-Statistik lesen
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAGE: ${{ inputs.tage }}
        run: python3 alarm/zugriffe.py "$TAGE"
