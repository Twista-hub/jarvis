# Read only: counts TED contract notices per European country and trade (market analysis).
name: Europa-Marktanalyse
on:
  workflow_dispatch:
    inputs:
      tage: { description: "Zeitraum in Tagen", default: "60" }
      probe: { description: "Nur Abfrage-Syntax testen (ja/nein)", default: "nein" }
permissions:
  contents: read
jobs:
  zaehlen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python alarm/europa_markt.py "${{ inputs.tage }}" ${{ inputs.probe == 'ja' && '--probe' || '' }} | tee ergebnis.md
      - run: cat ergebnis.md >> "$GITHUB_STEP_SUMMARY"
