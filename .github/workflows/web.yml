# Deploys the upload worker jarvis-alarm (folder web/): customers upload tender documents, Claude writes the Steckbrief.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY; optional SMTP_PASSWORD (invitation mails).
name: Upload-Seite ausrollen

on:
  push:
    branches: [main]
    paths: ["web/**", "alarm/profile.json", "alarm/steckbrief-anleitung.txt", ".github/workflows/web.yml"]
  workflow_dispatch:
    inputs:
      recherche:
        description: "Echte Firmenrecherche im App-Worker prüfen (öffentliche Testfirma, vorhandenes KI-Budget)"
        type: boolean
        default: false
      standorte:
        description: "Firmenrecherche mit PerLease und mehreren Niederlassungen prüfen"
        type: boolean
        default: false
      test:
        description: "Danach Bundesbank-Testunterlagen hochladen und Steckbrief zeigen (kostet ca. 0,50 $)"
        type: boolean
        default: false

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
        shell: bash -eo pipefail {0}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      URL: https://app.wpdigitalranger.com
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare-Schlüssel vorhanden?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen noch, nichts ausgerollt."
            echo "OHNE_SCHLUESSEL=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.OHNE_SCHLUESSEL != '1'
        run: npm ci
      - if: env.OHNE_SCHLUESSEL != '1'
        run: npm run check
      - if: env.OHNE_SCHLUESSEL != '1'
        run: npm test

      - name: Speicher (R2, EU) bereitstellen
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          npx wrangler r2 bucket create jarvis-auftraege --jurisdiction eu 2>&1 | tail -3 || true
          npx wrangler r2 bucket lifecycle add jarvis-auftraege auftraege-30-tage auftraege/ --expire-days 30 --jurisdiction eu --force 2>&1 | tail -3 || true
          npx wrangler r2 bucket lifecycle add jarvis-auftraege zaehler-7-tage zaehler/ --expire-days 7 --jurisdiction eu --force 2>&1 | tail -3 || true
          npx wrangler r2 bucket lifecycle list jarvis-auftraege --jurisdiction eu

      - name: Auf geprüftes Katalogschema warten
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for versuch in $(seq 1 30); do
            for host in aws-1-eu-central-1 aws-0-eu-central-1; do
              if [ "$(psql "postgresql://postgres.juuuifrcxmitkqudqngq:$pw@$host.pooler.supabase.com:6543/postgres" -tAc "select to_regclass('jarvis_katalog.ki_budget') is not null and to_regprocedure('jarvis_katalog.ki_tageslimit(timestamp with time zone)') is not null" 2>/dev/null)" = t ]; then exit 0; fi
            done
            sleep 10
          done
          echo "::error::Katalogmigration noch nicht bereit; bestehende App bleibt online."; exit 1
      - name: Datenbankzugang über Hyperdrive
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          id=$(python3 scripts/hyperdrive.py)
          printf '\n[[hyperdrive]]\nbinding = "HYPERDRIVE"\nid = "%s"\n' "$id" >> wrangler.toml
      - if: env.OHNE_SCHLUESSEL != '1'
        run: |
          npx wrangler deploy
          # The worker reaches the database only through Hyperdrive now; drop the old direct password.
          npx wrangler secret delete SUPABASE_DB_PASSWORD --force 2>/dev/null || true

      - name: Schlüssel setzen
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          # Password of kontakt@wpdigitalranger.com; until it exists, invitations are shown as a link.
          if [ -n "$SMTP_PASSWORD" ]; then printf '%s' "$SMTP_PASSWORD" | npx wrangler secret put SMTP_PASSWORD; fi
          # GitHub token (Actions: write on this repo): starts the first hit list right after the setup assistant.
          if [ -n "$ACTIONS_TOKEN" ]; then printf '%s' "$ACTIONS_TOKEN" | npx wrangler secret put ACTIONS_TOKEN; fi
          # A fresh test code on every deploy; only its hash goes to the worker.
          code=$(openssl rand -hex 12)
          echo "::add-mask::$code"
          echo "TEST_CODE=$code" >> "$GITHUB_ENV"
          printf '%s' "$code" | sha256sum | cut -d' ' -f1 | tr -d '\n' | npx wrangler secret put TEST_CODE_HASH

      - name: Seite erreichbar?
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          sleep 10
          # Save first, then grep: "curl | grep -q" fails with exit 23 when grep stops reading early.
          curl -fsS "$URL/" -o start.html && grep -q "Jarvis findet passende Ausschreibungen" start.html
          curl -fsS "$URL/hochladen" -o hochladen.html && grep -q "Unterlagen prüfen lassen" hochladen.html
          curl -fsS "$URL/impressum" -o impressum.html && grep -q "Rochusstraße" impressum.html
          curl -fsS "$URL/app.js" -o app.js && grep -q "push-test" app.js
          echo "Upload-Seite: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Datenbankverbindung der App prüfen (ohne Änderung)
        if: env.OHNE_SCHLUESSEL != '1'
        run: |
          sleep 20 # let the new worker version propagate, or the old one answers
          status=$(curl -sS --max-time 50 -o db-check.json -w '%{http_code}' -d "code=$TEST_CODE" -d "ki=1" "$URL/__intern/db-check")
          cat db-check.json
          test "$status" = 200
          grep -q '"ok":true' db-check.json
          grep -q '"ki":true' db-check.json
          echo "Hyperdrive, KI-Budget und ein Mini-KI-Aufruf im App-Worker erfolgreich." >> "$GITHUB_STEP_SUMMARY"

      - name: Firmenrecherche im App-Worker prüfen
        if: (inputs.recherche || inputs.standorte) && env.OHNE_SCHLUESSEL != '1'
        run: |
          status=$(curl -sS --max-time 350 -o recherche-check.json -w '%{http_code}' -d "code=$TEST_CODE" -d "recherche=1" -d "standorte=${{ inputs.standorte && '1' || '0' }}" "$URL/__intern/db-check")
          cat recherche-check.json
          test "$status" = 200
          python3 - <<'PY'
          import json
          r = json.load(open('recherche-check.json'))
          p = r['profil']
          assert r['ok'] and r['suchanfragen'] >= 1
          assert len(p['websuche_beschreibung']) >= 20 and p['websuche_quellen']
          if r.get('mehrere_standorte'):
            assert len(p.get('firmenstandorte', [])) >= 2, 'Mehrere belegte Niederlassungen fehlen'
            assert all(o.get('quelle', '').startswith('https://') for o in p['firmenstandorte'])
          assert p['leistungen'] and any(l['woerter'] for l in p['leistungen'])
          print('Echte Firmenrecherche: Suchaufträge, Quellen und konkrete Leistungen vorhanden.')
          PY
          cat recherche-check.json >> "$GITHUB_STEP_SUMMARY"

      - name: Test mit Bundesbank-Unterlagen
        if: inputs.test && env.OHNE_SCHLUESSEL != '1'
        working-directory: alarm/test-unterlagen/dtvp-CXP4Y63M3X1
        run: |
          args=()
          for f in *.pdf *.docx *.xlsx; do [ -e "$f" ] && args+=(-F "dateien=@$f"); done
          loc=$(curl -fsS -o /dev/null -w '%{redirect_url}' -F "code=$TEST_CODE" -F "titel=Test: Bundesbank Leihpersonal Gastronomie" "${args[@]}" "$URL/hochladen")
          echo "Auftrag: $loc"
          for i in $(seq 1 60); do
            sleep 20
            page=$(curl -fsS "$loc")
            if ! grep -q "Wird geprüft" <<<"$page"; then break; fi
            echo "läuft noch ($i)"
          done
          python3 -c "import html,re,sys;t=sys.stdin.read();t=re.sub(r'(?s)<style.*?</style>','',t);print(html.unescape(re.sub(r'<[^>]+>','',t)))" <<<"$page" | sed '/^\s*$/d' | tee steckbrief.txt
          { echo "## Test-Steckbrief"; echo; echo "$loc"; echo; echo '```'; cat steckbrief.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "Fristen" steckbrief.txt
          # Calculation: German number input, result table with price per hour
          kalk=$(curl -fsSL -d "lohn=15,50" -d "nebenkosten=23" -d "ausfall=20" -d "zuschlaege=5" -d "gemeinkosten=15" -d "gewinn=8" -d "sonstiges=0" "$loc/kalkulation")
          python3 -c "import html,re,sys;t=sys.stdin.read();i=t.find('Kalkulation');print(html.unescape(re.sub(r'<[^>]+>',' ',t[i:i+6000])))" <<<"$kalk" | tr -s ' ' | tee kalkulation.txt
          { echo "## Test-Kalkulation"; echo '```'; cat kalkulation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "Angebotspreis pro Stunde" kalkulation.txt
