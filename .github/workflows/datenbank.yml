# Database migrations for the Supabase project "jarvis" (juuuifrcxmitkqudqngq, Frankfurt).
# Needs only the repository secret SUPABASE_DB_PASSWORD. "anzeigen" is a dry run;
# "einspielen" applies supabase/migrations and needs the input EINSPIELEN.
name: Datenbank

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/tests/**", ".github/workflows/datenbank.yml"]
  workflow_dispatch:
    inputs:
      aktion:
        type: choice
        options: [anzeigen, einspielen, anmeldungen, loeschdiagnose, abos, beispielfirma_test, auftraggeber_diagnose]
        default: anzeigen
      bestaetigung:
        description: "Zum Einspielen hier EINSPIELEN eintippen"
        default: ""
      ziel_hash:
        description: "Nur für die lesende Kontolöschungsdiagnose: gesalzener SHA-256 der kleingeschriebenen E-Mail"
        type: string
        default: ""
      ziel_salz:
        description: Salt zur lesenden Kontolöschungsdiagnose
        type: string
        default: ""

concurrency:
  group: datenbank
  cancel-in-progress: false

jobs:
  rechte:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/rechte_test.sql
        env:
          PGPASSWORD: test
  datenbank:
    needs: rechte
    runs-on: ubuntu-latest
    env:
      REF: juuuifrcxmitkqudqngq
      PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
      AKTION: ${{ inputs.aktion }}
      BESTAETIGUNG: ${{ inputs.bestaetigung }}
      EREIGNIS: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verbindung finden
        run: |
          if [ -z "$PW" ]; then echo "::error::Secret SUPABASE_DB_PASSWORD fehlt."; exit 1; fi
          pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["PW"],safe=""))')
          for host in aws-1-eu-central-1 aws-0-eu-central-1; do
            url="postgresql://postgres.$REF:$pw@$host.pooler.supabase.com:5432/postgres"
            if psql "$url" -tAc "select 'verbunden: ' || version()" 2>/dev/null; then
              echo "::add-mask::$url"; echo "DB_URL=$url" >> "$GITHUB_ENV"; exit 0
            fi
          done
          psql "postgresql://postgres.$REF:$pw@aws-1-eu-central-1.pooler.supabase.com:5432/postgres" -tAc "select 1" 2>&1 | sed 's/postgres\.[a-z]*:[^@]*@/***@/' | head -3
          echo "::error::Keine Verbindung (Passwort falsch, Projekt pausiert oder Pool voll)."; exit 1
      - name: Letzte Anmeldungen (Fehlersuche Login)
        if: inputs.aktion == 'anmeldungen'
        run: |
          # E-Mail-Adressen nur gekürzt (erste 3 Zeichen + Domain).
          # Registrierungs-Trichter: Konten der letzten 30 Tage, ob die Mail bestätigt ist und ob eine Firma angelegt wurde.
          psql "$DB_URL" -c "select u.created_at::date as tag, regexp_replace(u.email, '^(.{3})[^@]*', '\\1…') as wer, u.email_confirmed_at is not null as bestaetigt, u.last_sign_in_at is not null as angemeldet, exists(select 1 from public.mitglieder m where m.user_id = u.id) as hat_firma, u.raw_user_meta_data->'herkunft' as herkunft from auth.users u where u.created_at > now() - interval '30 days' order by u.created_at desc limit 50"
          # Kanäle: Herkunft der Firmen (utm/verweisende Domain) mit Plan und Abo-Status.
          psql "$DB_URL" -c "select coalesce(herkunft->>'quelle', herkunft->>'verweis', '(direkt/unbekannt)') as kanal, herkunft->>'medium' as medium, herkunft->>'kampagne' as kampagne, count(*) as firmen, count(*) filter (where abo_status in ('active', 'trialing')) as mit_abo from public.firmen where erstellt > now() - interval '90 days' group by 1, 2, 3 order by 4 desc"
          psql "$DB_URL" -c "select created_at, payload->>'action' as aktion, regexp_replace(coalesce(payload->>'actor_username', payload->'traits'->>'user_email', ''), '^(.{3})[^@]*', '\\1…') as wer, payload->>'log_type' as art from auth.audit_log_entries order by created_at desc limit 25"
          psql "$DB_URL" -c "select created_at, authentication_method, auth_code_issued_at, updated_at from auth.flow_state order by created_at desc limit 10"
      - name: Kontolöschungs-Blocker prüfen (nur lesend)
        if: inputs.aktion == 'loeschdiagnose'
        env:
          ZIEL_HASH: ${{ inputs.ziel_hash }}
          ZIEL_SALZ: ${{ inputs.ziel_salz }}
        run: |
          if ! [[ "$ZIEL_HASH" =~ ^[a-f0-9]{64}$ && "$ZIEL_SALZ" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Für die Diagnose fehlen Hash oder Salt im richtigen Format."; exit 1
          fi
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -v ziel_hash="$ZIEL_HASH" -v ziel_salz="$ZIEL_SALZ" <<'SQL'
          create temp table _ziel as
            select id from auth.users
            where encode(sha256(convert_to(lower(email) || :'ziel_salz', 'UTF8')), 'hex') = :'ziel_hash';
          select count(*) as passendes_konto from _ziel;
          do $$
          declare
            ziel_id uuid;
            ref record;
            anzahl bigint;
            aktion text;
          begin
            select id into ziel_id from pg_temp._ziel limit 1;
            if ziel_id is null then
              raise notice 'Kein Konto zum Hash gefunden.';
              return;
            end if;
            for ref in
              select c.conrelid::regclass as tabelle, c.conname as constraint_name,
                     a.attname as spalte, c.confdeltype as loeschregel
              from pg_constraint c
              cross join lateral unnest(c.conkey) as k(attnum)
              join pg_attribute a on a.attrelid=c.conrelid and a.attnum=k.attnum
              where c.contype='f' and c.confrelid='auth.users'::regclass
            loop
              execute format('select count(*) from %s where %I = $1', ref.tabelle, ref.spalte)
                into anzahl using ziel_id;
              aktion := case ref.loeschregel when 'a' then 'NO ACTION' when 'r' then 'RESTRICT'
                        when 'c' then 'CASCADE' when 'n' then 'SET NULL' when 'd' then 'SET DEFAULT' end;
              raise notice 'FK: Tabelle=%, Constraint=%, Spalte=%, Regel=%, betroffene Zeilen=%',
                ref.tabelle, ref.constraint_name, ref.spalte, aktion, anzahl;
            end loop;
            if to_regclass('storage.objects') is not null then
              execute 'select count(*) from storage.objects o where coalesce(to_jsonb(o)->>''owner_id'', to_jsonb(o)->>''owner'') = $1'
                into anzahl using ziel_id::text;
              raise notice 'Supabase-Storage-Objekte dieses Kontos: %', anzahl;
            end if;
          end $$;
          SQL
      - name: Stripe-Abos anzeigen (nur lesend)
        if: inputs.aktion == 'abos'
        run: |
          psql "$DB_URL" -X -c "select left(id::text, 8) as firma, paket, stripe_kunde is not null as kunde, stripe_abo, abo_status, abo_bis, abo_zahlweise, abo_kuendigt from public.firmen where stripe_kunde is not null or stripe_abo is not null"
          psql "$DB_URL" -X -c "select zeit, typ, left(firma_id::text, 8) as firma from jarvis_intern.stripe_ereignisse order by zeit desc limit 20"
          psql "$DB_URL" -X -c "select name, paket, probe_bis::date, jarvis_intern.plan_von(id) as plan_wirksam, zusatz_einsatzkraefte, steckbrief_guthaben, abo_status, abo_kuendigt from public.firmen order by erstellt"
      - name: Beispielfirma zurück auf test (nach einem Stripe-Testkauf)
        if: inputs.aktion == 'beispielfirma_test'
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "update public.firmen set paket = 'test', zusatz_einsatzkraefte = 0 where id = 'c3401eb9-aa97-47a9-887d-2287c07363ff' returning name, paket"
      - name: Auftraggeber-Kennungen prüfen (nur lesend, öffentliche Bekanntmachungen)
        if: inputs.aktion == 'auftraggeber_diagnose'
        run: |
          psql "$DB_URL" -X -c "select quelle, count(*) as zeilen, count(distinct auftraggeber_id) as ids, count(distinct lower(auftraggeber)) as namen from public.vergabekatalog group by 1 order by 2 desc"
          psql "$DB_URL" -X -c "select left(auftraggeber_id, 20) as id, count(*) as zeilen, count(distinct lower(auftraggeber)) as namen, min(left(auftraggeber, 40)) as bsp from public.vergabekatalog where quelle = 'bks' group by auftraggeber_id order by 3 desc limit 10"
          psql "$DB_URL" -X -c "select coalesce(b->'identifier'->>'scheme', '–') as scheme, left(coalesce(b->'identifier'->>'id', '–'), 40) as ident, count(*) as zeilen, count(distinct lower(v.auftraggeber)) as namen from public.vergabekatalog v, lateral (select coalesce((select p from jsonb_array_elements(case when jsonb_typeof(v.roh->'parties') = 'array' then v.roh->'parties' else '[]' end) p where p->>'id' = v.roh->'buyer'->>'id' limit 1), '{}'::jsonb) || coalesce(v.roh->'buyer', '{}'::jsonb) as b) x where v.quelle = 'bks' and v.quell_datum > now() - interval '60 days' group by 1, 2 order by 4 desc limit 15"
          psql "$DB_URL" -X -c "select jsonb_object_keys(coalesce(v.roh->'buyer', '{}'::jsonb)) as buyer_feld, count(*) from public.vergabekatalog v where v.quelle = 'bks' and v.quell_datum > now() - interval '30 days' group by 1 order by 2 desc"
          psql "$DB_URL" -X -c "select left((p->'identifier')::text, 200) as identifier, left((p->'additionalIdentifiers')::text, 200) as weitere from public.vergabekatalog v, jsonb_array_elements(v.roh->'parties') p where v.quelle = 'bks' and p->>'id' = v.roh->'buyer'->>'id' and v.quell_datum > now() - interval '3 days' limit 8"
          psql "$DB_URL" -X -c "select count(*) as abos, count(distinct auftraggeber_id) from public.auftraggeber_abos"
      - name: Migrationen
        if: inputs.aktion != 'anmeldungen' && inputs.aktion != 'auftraggeber_diagnose'
        run: |
          set -o pipefail
          # Output (also errors) through a filter that removes credentials from connection strings.
          sauber() { sed -E 's#://[^@ ]*@#://***@#g'; }
          npx -y supabase@2.122.1 db push --db-url "$DB_URL" --include-all --dry-run 2>&1 | sauber
          if [ "$EREIGNIS" = push ] || { [ "$AKTION" = einspielen ] && [ "$BESTAETIGUNG" = EINSPIELEN ]; }; then
            npx -y supabase@2.122.1 db push --db-url "$DB_URL" --include-all --yes 2>&1 | sauber
          fi
      - name: Tabellen und Firmen
        run: |
          psql "$DB_URL" -tAc "select table_name from information_schema.tables where table_schema='public' order by 1"
          psql "$DB_URL" -c "select f.id, f.name, f.paket, f.erstellt::date, count(m.*) as mitglieder, (select count(*) from public.vorgaenge v where v.firma_id = f.id) as vorgaenge from public.firmen f left join public.mitglieder m on m.firma_id = f.id group by f.id order by f.erstellt"

      - name: Mitgliedschaften (nur lesend, E-Mails gekürzt)
        run: |
          psql "$DB_URL" -c "select regexp_replace(u.email, '^(.{3})[^@]*', '\\1…') as wer, f.name as firma, m.rolle, m.aktiv, m.finanzen, m.erstellt::date from public.mitglieder m join auth.users u on u.id = m.user_id join public.firmen f on f.id = m.firma_id order by u.email, m.erstellt"

      - name: App-Fehler der letzten 7 Tage (nur lesend, Pfade ohne Personendaten)
        run: |
          psql "$DB_URL" -c "select zeit, art, text from jarvis_intern.fehler_meldungen where zeit > now() - interval '7 days' order by zeit desc limit 60"

      - name: KI-Budget (nur lesend)
        run: |
          psql "$DB_URL" -c "select monat, limit_usd, reserviert from jarvis_katalog.ki_budget order by monat desc limit 2"
          psql "$DB_URL" -c "select zweck, count(*) as aufrufe, count(*) filter(where verbraucht is null) as offen, round(sum(reserviert),3) as reserviert, round(sum(verbraucht),3) as verbraucht from jarvis_katalog.ki_kosten where zeit>=date_trunc('day',now()) group by zweck"
          psql "$DB_URL" -c "select zeit, zweck, reserviert, verbraucht from jarvis_katalog.ki_kosten order by zeit desc limit 10"
          # Monat: wofür (Zweck, Modell, Firma) und an welchen Tagen.
          psql "$DB_URL" -c "select k.zweck, coalesce(k.modell, '–') as modell, coalesce(f.name, '(ohne Firma)') as firma, count(*) as aufrufe, round(sum(coalesce(k.verbraucht, k.reserviert)), 2) as usd from jarvis_katalog.ki_kosten k left join public.firmen f on f.id = k.firma_id where k.zeit >= date_trunc('month', now()) group by 1, 2, 3 order by 5 desc limit 30"
          psql "$DB_URL" -c "select (k.zeit at time zone 'Europe/Berlin')::date as tag, k.zweck, count(*) as aufrufe, round(sum(coalesce(k.verbraucht, k.reserviert)), 2) as usd from jarvis_katalog.ki_kosten k where k.zeit >= date_trunc('month', now()) group by 1, 2 order by 1, 2"

      - name: KI-Budget-Funktion testen (Rollback, speichert nichts)
        run: |
          psql "$DB_URL" -X -c "begin" -c "select jarvis_katalog.ki_reservieren(0.01,'test') as id" -c "rollback" || true
          psql "$DB_URL" -X -c "select p.proname, pg_get_userbyid(p.proowner) as owner, n.nspname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.proname like 'ki_%'" || true

      - name: Standorte und Zeilenrechte prüfen
        run: |
          psql "$DB_URL" -c "select f.name, count(*) filter(where b.parent_id is null) as regionen, count(*) filter(where b.parent_id is not null) as standorte from public.firmen f join public.bereiche b on b.firma_id=f.id group by f.name"
          psql "$DB_URL" -c "select relname,relrowsecurity from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('vorgang_freigaben','firmenunterlagen','angebotsmappen')"
