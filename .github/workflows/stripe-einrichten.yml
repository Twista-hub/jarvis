# Creates (once, idempotent) the Crewtender plans at Stripe – products with monthly and yearly prices under the lookup keys
# crewtender_<plan>_<monat|jahr> – and the webhook https://crewtender.eu/stripe/webhook. The webhook secret goes straight
# into the app worker (wrangler secret), it is never printed. Uses the repository secret STRIPE_SECRET_KEY (test or live).
name: Stripe einrichten
on:
  workflow_dispatch:
    inputs:
      webhook_neu:
        description: "Webhook neu anlegen (nötig, wenn das Secret im Worker fehlt): ja/nein"
        default: "nein"
      abgleich:
        description: "Nur Abo-Abgleich: laufende Abos anzeigen und neu an den Webhook schicken (ja/nein)"
        default: "nein"
      testabos_beenden:
        description: "Nur im Testmodus: alle laufenden Test-Abos sofort beenden (ja/nein)"
        default: "nein"
      testabo_plan:
        description: "Nur im Testmodus: laufende Test-Abos auf diesen Plan umstellen (basis/pro/business, leer = nichts)"
        default: ""
      testabo_kraefte:
        description: "Nur im Testmodus: Zahl der weiteren Einsatzkräfte im Test-Abo setzen (leer = nichts)"
        default: ""
      testpaket_firma:
        description: "Nur im Testmodus: Bezahlseite für ein Steckbrief-Paket dieser Firma (UUID) anlegen (leer = nichts)"
        default: ""
permissions:
  contents: read
concurrency:
  group: stripe-einrichten
jobs:
  einrichten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --silent
        working-directory: web
      - name: Pläne, Preise, Webhook
        if: inputs.abgleich != 'ja' && inputs.testabos_beenden != 'ja' && inputs.testabo_plan == '' && inputs.testabo_kraefte == '' && inputs.testpaket_firma == ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_NEU: ${{ inputs.webhook_neu }}
        run: |
          test -n "$STRIPE_SECRET_KEY" || { echo "::error::Secret STRIPE_SECRET_KEY fehlt"; exit 1; }
          # Secret key (sk_) or restricted key (rk_, "full access except sensitive operations"); spaces from copying are dropped.
          K=$(printf %s "$STRIPE_SECRET_KEY" | tr -d '[:space:]')
          case "$K" in sk_test_*|rk_test_*) echo "Modus: TEST";; sk_live_*|rk_live_*) echo "Modus: LIVE";; *) echo "::error::Unbekannter Schlüssel (beginnt mit ${K:0:3}…, erwartet sk_live_ oder rk_live_)"; exit 1;; esac
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          KEY = "".join(os.environ["STRIPE_SECRET_KEY"].split())
          def api(pfad, daten=None, methode=None):
              body = urllib.parse.urlencode(daten, doseq=True).encode() if daten is not None else None
              req = urllib.request.Request(f"https://api.stripe.com/v1/{pfad}", data=body, method=methode or ("POST" if body is not None else "GET"),
                                           headers={"Authorization": f"Bearer {KEY}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          PLAENE = [("basis", "Crewtender Basis", 5900), ("pro", "Crewtender Pro", 14900), ("business", "Crewtender Business", 39900)]
          for plan, name, monat in PLAENE:
              schluessel = {f"crewtender_{plan}_monat": ("month", monat), f"crewtender_{plan}_jahr": ("year", monat * 10)}
              da = {p["lookup_key"] for p in api("prices?" + urllib.parse.urlencode([("lookup_keys[]", k) for k in schluessel] + [("active", "true")]))["data"]}
              fehlen = [k for k in schluessel if k not in da]
              if not fehlen:
                  print(f"{name}: Preise vorhanden"); continue
              produkte = api("products/search?" + urllib.parse.urlencode({"query": f"metadata['crewtender_plan']:'{plan}'"}))["data"]
              produkt = produkte[0]["id"] if produkte else api("products", {"name": name, "metadata[crewtender_plan]": plan,
                  "description": "Ausschreibungen finden, Angebote schreiben, Team planen. Kleinunternehmer nach § 19 UStG, keine Umsatzsteuer."})["id"]
              for k in fehlen:
                  intervall, betrag = schluessel[k]
                  api("prices", {"product": produkt, "currency": "eur", "unit_amount": betrag, "recurring[interval]": intervall, "lookup_key": k,
                                 "tax_behavior": "unspecified", "nickname": f"{name} {'monatlich' if intervall == 'month' else 'jährlich'}"})
                  print(f"{name}: Preis {k} angelegt ({betrag / 100:.0f} € je {'Monat' if intervall == 'month' else 'Jahr'})")
          # Add-ons (07.11.2026): field workers per month on the subscription (yearly = 12 months, same interval as the plan),
          # Business from the 501st field worker (= 401st add-on) cheaper; Steckbrief pack one-off.
          def produkt_fuer(merkmal, name, text):
              p = api("products/search?" + urllib.parse.urlencode({"query": f"metadata['crewtender_zusatz']:'{merkmal}'"}))["data"]
              return p[0]["id"] if p else api("products", {"name": name, "metadata[crewtender_zusatz]": merkmal, "description": text})["id"]
          ZUSATZ = {
              "crewtender_kraft_pro_monat": {"recurring[interval]": "month", "unit_amount": 350},
              "crewtender_kraft_pro_jahr": {"recurring[interval]": "year", "unit_amount": 4200},
              "crewtender_kraft_business_monat": {"recurring[interval]": "month", "billing_scheme": "tiered", "tiers_mode": "graduated",
                  "tiers[0][up_to]": 400, "tiers[0][unit_amount]": 300, "tiers[1][up_to]": "inf", "tiers[1][unit_amount]": 250},
              "crewtender_kraft_business_jahr": {"recurring[interval]": "year", "billing_scheme": "tiered", "tiers_mode": "graduated",
                  "tiers[0][up_to]": 400, "tiers[0][unit_amount]": 3600, "tiers[1][up_to]": "inf", "tiers[1][unit_amount]": 3000},
              "crewtender_steckbriefe_10": {"unit_amount": 1500},
          }
          da = {p["lookup_key"] for p in api("prices?" + urllib.parse.urlencode([("lookup_keys[]", k) for k in ZUSATZ] + [("active", "true")]))["data"]}
          for k, werte in ZUSATZ.items():
              if k in da:
                  print(f"Zusatz {k}: vorhanden"); continue
              produkt = produkt_fuer("steckbriefe", "Crewtender Steckbrief-Paket (10 Steckbriefe)", "10 Steckbriefe aus Unterlagen, einmalig, verfallen nicht.") if "steckbriefe" in k \
                  else produkt_fuer("einsatzkraft", "Crewtender weitere Einsatzkraft", "Weitere Einsatzkraft mit eigenem Zugang, über das Kontingent des Plans hinaus.")
              api("prices", {"product": produkt, "currency": "eur", "lookup_key": k, "tax_behavior": "unspecified", "nickname": k, **werte})
              print(f"Zusatz {k}: angelegt")
          URL = "https://crewtender.eu/stripe/webhook"
          EREIGNISSE = ["checkout.session.completed", "customer.subscription.created", "customer.subscription.updated", "customer.subscription.deleted"]
          vorhanden = [w for w in api("webhook_endpoints?limit=100")["data"] if w["url"] == URL]
          if vorhanden and os.environ.get("WEBHOOK_NEU") != "ja":
              print("Webhook vorhanden (Secret liegt schon im Worker; mit webhook_neu=ja neu anlegen)")
          else:
              for w in vorhanden:
                  api(f"webhook_endpoints/{w['id']}", methode="DELETE"); print("alter Webhook gelöscht")
              w = api("webhook_endpoints", [("url", URL), ("description", "Crewtender: Plan der Firma setzen")] + [("enabled_events[]", e) for e in EREIGNISSE])
              subprocess.run(["npx", "wrangler", "secret", "put", "STRIPE_WEBHOOK_SECRET"], input=w["secret"].encode(), cwd="web", check=True, stdout=subprocess.DEVNULL)
              print("Webhook angelegt, Secret im Worker gesetzt")
          subprocess.run(["npx", "wrangler", "secret", "put", "STRIPE_SECRET_KEY"], input=KEY.encode(), cwd="web", check=True, stdout=subprocess.DEVNULL)
          print("STRIPE_SECRET_KEY im Worker gesetzt")
          PY
      - name: Abo-Abgleich
        if: inputs.abgleich == 'ja'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Lists running subscriptions and touches their metadata, so Stripe sends customer.subscription.updated with the
          # current state again and the webhook brings the firm up to date (e.g. after a fix in the event mapping).
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          KEY = os.environ["STRIPE_SECRET_KEY"]
          def api(pfad, daten=None):
              req = urllib.request.Request(f"https://api.stripe.com/v1/{pfad}", data=urllib.parse.urlencode(daten).encode() if daten else None,
                  headers={"Authorization": f"Bearer {KEY}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          for s in api("subscriptions?status=all&limit=100")["data"]:
              print(s["id"], s["status"], "firma", (s.get("metadata") or {}).get("firma", "-")[:8], "cancel_at", s.get("cancel_at"), "cancel_at_period_end", s.get("cancel_at_period_end"))
              if s["status"] in ("active", "trialing", "past_due"):
                  api(f"subscriptions/{s['id']}", {"metadata[abgleich]": str(int(time.time()))}); print("  -> neu an den Webhook geschickt")
          PY
      - name: Test-Abos beenden
        if: inputs.testabos_beenden == 'ja'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Only with a test key: ends every running test subscription at once (Stripe sends customer.subscription.deleted,
          # the webhook sets the firm to Free). Never touches live subscriptions.
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "::error::Nur im Testmodus erlaubt"; exit 1;; esac
          python3 - <<'PY'
          import json, os, urllib.request
          KEY = os.environ["STRIPE_SECRET_KEY"]
          def api(pfad, methode="GET"):
              req = urllib.request.Request(f"https://api.stripe.com/v1/{pfad}", method=methode, headers={"Authorization": f"Bearer {KEY}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          for s in api("subscriptions?status=all&limit=100")["data"]:
              if s["status"] in ("active", "trialing", "past_due", "unpaid", "incomplete"):
                  api(f"subscriptions/{s['id']}", "DELETE"); print("beendet:", s["id"], "firma", (s.get("metadata") or {}).get("firma", "-")[:8])
          PY
      - name: Test-Abos umstellen
        if: inputs.testabo_plan != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PLAN: ${{ inputs.testabo_plan }}
        run: |
          # Only with a test key: switches running test subscriptions to another plan (monthly) like "Zu … wechseln" in the
          # app (aboWechseln) and prints Stripe's answer, so a refusal is visible.
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "::error::Nur im Testmodus erlaubt"; exit 1;; esac
          case "$PLAN" in basis|pro|business) ;; *) echo "::error::Plan basis, pro oder business"; exit 1;; esac
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          KEY, PLAN = os.environ["STRIPE_SECRET_KEY"], os.environ["PLAN"]
          def api(pfad, daten=None):
              req = urllib.request.Request(f"https://api.stripe.com/v1/{pfad}", data=urllib.parse.urlencode(daten).encode() if daten is not None else None,
                                           headers={"Authorization": f"Bearer {KEY}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("Stripe-Fehler:", e.code, e.read().decode()[:600]); raise SystemExit(1)
          preis = api("prices?" + urllib.parse.urlencode([("lookup_keys[]", f"crewtender_{PLAN}_monat"), ("active", "true")]))["data"][0]["id"]
          for s in api("subscriptions?status=active&limit=100")["data"]:
              posten = next((p for p in s["items"]["data"] if re.fullmatch(r"crewtender_(basis|pro|business)_(monat|jahr)", p["price"].get("lookup_key") or "")), s["items"]["data"][0])
              daten = {"items[0][id]": posten["id"], "items[0][price]": preis, "proration_behavior": "create_prorations", "metadata[plan]": PLAN, "metadata[zahlweise]": "monat"}
              if s.get("cancel_at_period_end"):
                  daten["cancel_at_period_end"] = "false"
              elif s.get("cancel_at"):
                  daten["cancel_at"] = ""
              neu = api(f"subscriptions/{s['id']}", daten)
              print("umgestellt:", s["id"], "->", PLAN, "| cancel_at:", neu.get("cancel_at"), "| status:", neu.get("status"))
          PY
      - name: Zusatz testen
        if: inputs.testabo_kraefte != '' || inputs.testpaket_firma != ''
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          KRAEFTE: ${{ inputs.testabo_kraefte }}
          FIRMA: ${{ inputs.testpaket_firma }}
        run: |
          # Only with a test key: the same Stripe calls as "Anzahl ändern" (kraefteSetzen) and "Paket kaufen" (paketKaufen).
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "::error::Nur im Testmodus erlaubt"; exit 1;; esac
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          KEY = os.environ["STRIPE_SECRET_KEY"]
          def api(pfad, daten=None):
              req = urllib.request.Request(f"https://api.stripe.com/v1/{pfad}", data=urllib.parse.urlencode(daten).encode() if daten is not None else None,
                                           headers={"Authorization": f"Bearer {KEY}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("Stripe-Fehler:", e.code, e.read().decode()[:600]); raise SystemExit(1)
          preis = lambda k: api("prices?" + urllib.parse.urlencode([("lookup_keys[]", k), ("active", "true")]))["data"][0]["id"]
          if os.environ["KRAEFTE"]:
              n = int(os.environ["KRAEFTE"])
              for s in api("subscriptions?status=active&limit=100")["data"]:
                  plan = next((m for p in s["items"]["data"] if (m := re.fullmatch(r"crewtender_(basis|pro|business)_(monat|jahr)", p["price"].get("lookup_key") or ""))), None)
                  if not plan or plan[1] == "basis":
                      print("übersprungen (kein Pro/Business):", s["id"]); continue
                  da = next((p for p in s["items"]["data"] if (p["price"].get("lookup_key") or "").startswith("crewtender_kraft_")), None)
                  posten = {"items[0][deleted]": "true", "items[0][id]": da["id"]} if not n and da else \
                           {"items[0][id]": da["id"], "items[0][quantity]": n} if da else \
                           {"items[0][price]": preis(f"crewtender_kraft_{plan[1]}_{plan[2]}"), "items[0][quantity]": n}
                  neu = api(f"subscriptions/{s['id']}", {**posten, "proration_behavior": "create_prorations"})
                  print("Einsatzkräfte gesetzt:", s["id"], [(p["price"].get("lookup_key"), p.get("quantity")) for p in neu["items"]["data"]])
          if os.environ["FIRMA"]:
              f = os.environ["FIRMA"]
              assert re.fullmatch(r"[0-9a-f-]{36}", f)
              kunde = next((s["customer"] for s in api("subscriptions?status=all&limit=100")["data"] if (s.get("metadata") or {}).get("firma") == f), None)
              sitzung = api("checkout/sessions", {"mode": "payment", "line_items[0][price]": preis("crewtender_steckbriefe_10"), "line_items[0][quantity]": 1,
                  "client_reference_id": f, "metadata[firma]": f, "metadata[art]": "steckbriefe", "metadata[anzahl]": 10, "invoice_creation[enabled]": "true",
                  **({"customer": kunde} if kunde else {"customer_email": "test@crewtender.invalid"}), "locale": "de",
                  "success_url": "https://crewtender.eu/konto/plan?paket=1", "cancel_url": "https://crewtender.eu/konto/plan?abgebrochen=1"})
              print("TESTPAKET_URL", sitzung["url"])
          PY
