# Fast checks on every push: upload worker (types, tests) and the database rules.
name: Prüfen

on:
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", "alarm/**", ".github/workflows/pruefen.yml"]
  workflow_dispatch:

jobs:
  alarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography "psycopg[binary]" anthropic
      - run: python -m py_compile alarm/*.py
      - run: python -m unittest discover -s web/scripts -p 'test_*.py'
      - run: python -m unittest alarm.test_mail alarm.test_kurzbrief alarm.test_katalog alarm.test_ted alarm.test_suchgebiet alarm.test_suchqualitaet alarm.test_suchfilter alarm.test_sprache alarm.test_boamp alarm.test_bzp alarm.test_katalonien alarm.test_ausland_bestand alarm.test_ki_kosten alarm.test_anac alarm.test_anfrage alarm.test_oesterreich alarm.test_eforms alarm.test_katalog_fristen

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test

  datenbank:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rechte testen
        env:
          PGPASSWORD: test
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/rechte_test.sql
      - name: Suchabgleich mit echter Testdatenbank prüfen
        env:
          PGPASSWORD: test
          JARVIS_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/jarvis_suchtest
        run: |
          createdb -h localhost -U postgres jarvis_suchtest
          pip install -q "psycopg[binary]"
          python -m unittest alarm.test_speichern_sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Katalog-Blöcke mit echten Datenbankparametern prüfen
        env:
          JARVIS_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/jarvis_suchtest
        run: |
          cd web
          npm ci
          node --experimental-strip-types test/katalog-sql.integration.ts
