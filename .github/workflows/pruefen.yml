# Fast checks on every push: upload worker (types, tests) and the database rules.
name: Prüfen

on:
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", ".github/workflows/pruefen.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test

  datenbank:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rechte testen
        env:
          PGPASSWORD: test
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/rechte_test.sql
