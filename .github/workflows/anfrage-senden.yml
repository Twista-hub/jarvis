# Sends one approved request from docs/anfragen/ via kontakt@wpdigitalranger.com (copy to kontakt@ as Bcc).
# Only for requests Benjamin approved (CLAUDE.md). Without senden=JA it only shows the mail (dry run).
name: Anfrage senden

on:
  workflow_dispatch:
    inputs:
      datei:
        type: choice
        options: [placsp-anfrage, tenderned-anfrage]
      senden:
        description: "JA = wirklich senden"
        default: "nein"

jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Senden
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 alarm/anfrage_senden.py "docs/anfragen/${{ inputs.datei }}.md" ${{ inputs.senden == 'JA' && ' ' || '--probe' }}
