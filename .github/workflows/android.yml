# Android app for Google Play: a Trusted Web Activity built with Bubblewrap (android/README.md). Started by hand only.
# The upload keystore lives in the private R2 bucket, its password in the secret ANDROID_SCHLUESSEL_PASSWORT
# (created by Benjamin). GitHub minutes are free for this public repository; no AI, no database.
name: Android-App
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "probe (Technik prüfen, Wegwerf-Schlüssel), schluessel (einmalig Upload-Schlüssel anlegen), bauen (App-Bundle zum Hochladen)"
        type: choice
        options: [probe, schluessel, bauen]
        default: probe
permissions:
  contents: read
concurrency:
  group: android
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODUS: ${{ inputs.modus }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PASSWORT: ${{ secrets.ANDROID_SCHLUESSEL_PASSWORT }}
      ZIEL: jarvis-auftraege/android/crewtender-upload.keystore
      ALIAS: crewtender-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Schlüssel bereitstellen
        run: |
          set -euo pipefail
          cd android
          dname="CN=Crewtender, O=WP Digital Ranger, L=Uebach-Palenberg, C=DE"
          if [ "$MODUS" = probe ]; then
            # Throw-away key: only proves that the build works. Never upload this bundle.
            PASSWORT="$(openssl rand -hex 24)"; echo "::add-mask::$PASSWORT"; echo "SCHLUESSEL_PW=$PASSWORT" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 9125 -storepass "$PASSWORT" -keypass "$PASSWORT" -dname "$dname"
            exit 0
          fi
          if [ -z "$PASSWORT" ] || [ "${#PASSWORT}" -lt 16 ]; then echo "::error::Secret ANDROID_SCHLUESSEL_PASSWORT fehlt oder ist kürzer als 16 Zeichen."; exit 1; fi
          (cd ../web && npm ci --silent)
          # 0 = fetched, 1 = there is none yet, 2 = could not be read (never create a new key then: an existing one
          # must not be overwritten, updates of the app need the same key).
          holen() {
            local tmp="$RUNNER_TEMP/schluessel.tmp" aus
            rm -f "$tmp" android.keystore
            if aus="$( (cd ../web && npx wrangler r2 object get "$ZIEL" --file "$tmp" --remote --jurisdiction eu) 2>&1 )" && [ -s "$tmp" ]; then mv "$tmp" android.keystore; return 0; fi
            rm -f "$tmp"
            if echo "$aus" | grep -qiE "does not exist|not found|NoSuchKey|10007|404"; then return 1; fi
            echo "$aus" | tail -3; return 2
          }
          rc=0; holen || rc=$?
          if [ "$rc" = 0 ]; then
            echo "Upload-Schlüssel aus dem privaten Speicher geholt."
          elif [ "$rc" = 2 ]; then
            echo "::error::Der private Speicher war nicht lesbar. Kein neuer Schlüssel angelegt, bitte später noch einmal."; exit 1
          elif [ "$MODUS" = schluessel ]; then
            keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 9125 -storepass "$PASSWORT" -keypass "$PASSWORT" -dname "$dname"
            cp android.keystore "$RUNNER_TEMP/neu.keystore"
            (cd ../web && npx wrangler r2 object put "$ZIEL" --file "$RUNNER_TEMP/neu.keystore" --remote --jurisdiction eu --content-type application/octet-stream) >/dev/null
            rc=0; holen || rc=$?
            if [ "$rc" != 0 ] || ! cmp -s android.keystore "$RUNNER_TEMP/neu.keystore"; then echo "::error::Schlüssel ließ sich nach dem Speichern nicht wieder lesen."; exit 1; fi
            echo "Upload-Schlüssel neu angelegt und privat gespeichert."
          else
            echo "::error::Noch kein Upload-Schlüssel. Zuerst den Ablauf mit Modus schluessel starten."; exit 1
          fi
          echo "SCHLUESSEL_PW=$PASSWORT" >> "$GITHUB_ENV"   # the build step reads this name (a job-level env value cannot be replaced)
          # The certificate fingerprint is public information (it goes into assetlinks.json).
          keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$PASSWORT" | grep -E "SHA256:|Valid from" | sed 's/^ *//' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: App bauen
        if: inputs.modus != 'schluessel'
        run: |
          set -euo pipefail
          cd android
          npm i -g @bubblewrap/cli@latest >/dev/null
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Bubblewrap only generates the Android project from twa-manifest.json (closed stdin: a question from the tool
          # fails at once). Building and signing use the standard Android tools of the runner; Bubblewrap's own build
          # step does not accept the runner's SDK layout.
          bubblewrap update --skipVersionUpgrade < /dev/null
          chmod +x gradlew
          ./gradlew --no-daemon -q bundleRelease assembleRelease
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          cp app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab
          jarsigner -keystore android.keystore -storepass:env SCHLUESSEL_PW -keypass:env SCHLUESSEL_PW -sigalg SHA256withRSA -digestalg SHA-256 app-release-bundle.aab "$ALIAS" >/dev/null
          jarsigner -verify app-release-bundle.aab | tail -1
          "${bt}zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "${bt}apksigner" sign --ks android.keystore --ks-key-alias "$ALIAS" --ks-pass env:SCHLUESSEL_PW --key-pass env:SCHLUESSEL_PW --out app-release-signed.apk app-release-aligned.apk
          ls -la *.aab *.apk
          # What was really built (not what the tool says): package, version code, target API. Google Play requires
          # target API 36 (Android 16) since August 2026; raise MIN_ZIEL when Google raises it.
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt" dump badging app-release-signed.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion" | tee badging.txt | tee -a "$GITHUB_STEP_SUMMARY"
          ziel="$(grep -oE "targetSdkVersion:'[0-9]+'" badging.txt | grep -oE "[0-9]+")"
          if [ "${ziel:-0}" -lt 36 ]; then echo "::error::Ziel-API $ziel liegt unter der Vorgabe von Google Play (36). Nicht hochladen."; exit 1; fi
          grep -q "name='eu.crewtender.app'" badging.txt || { echo "::error::Falscher Paketname."; exit 1; }
          # Diagnosis (12.11.2026: on Benjamin's phone the app opened like a Chrome tab): what makes the app a Trusted Web
          # Activity is in the manifest and the string resources. Printed on every build, so a broken link is seen at once.
          echo "--- Manifest (Start, Verknüpfung mit der Website)"
          "$aapt" dump xmltree --file AndroidManifest.xml app-release-signed.apk | grep -E "E: (activity|service|provider|meta-data|data)|android:name|android:host|android:scheme|autoVerify|android:value|android:resource" | grep -iE "launcher|asset_statements|DEFAULT_URL|host|scheme|autoVerify|trusted|customtabs|FALLBACK|DelegationService|FocusActivity" | sed 's/^ *//' | head -60 || true
          echo "--- Zeichenketten"
          "$aapt" dump resources app-release-signed.apk | grep -A3 -E "string/(assetStatements|launchUrl|hostName|fallbackType|providerAuthority|appName)" | head -60 || true
          echo "--- Zertifikat der Upload-Signatur"
          "${bt}apksigner" verify --print-certs app-release-signed.apk | grep -E "SHA-256" || true
      - name: App-Bundle bereitstellen
        if: inputs.modus == 'bauen'
        uses: actions/upload-artifact@v4
        with:
          name: crewtender-play-paket
          path: |
            android/app-release-bundle.aab
            android/store/**
            android/STORE.md
          retention-days: 14
          if-no-files-found: error
