name: Tarifrechte-Anfragen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tarifrechte-anfragen.yml

permissions: {}

concurrency:
  group: tarifrechte-anfragen
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Einzelne Anfragen aus dem Jarvis-Postfach versenden
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          password = os.environ.get("SMTP_PASSWORD", "").strip()
          if not password:
              raise SystemExit("SMTP_PASSWORD ist nicht gesetzt")

          requests = [
              (
                  "LfF Bayern",
                  "poststelle@lff.bayern.de",
                  "Anfrage zur Nutzung der TV-L-Entgelttabellen in Jarvis",
                  """Guten Tag,

          das Landesamt für Finanzen veröffentlicht TV-L-Entgelttabellen sowie Tabellen für Pflege und den Sozial- und Erziehungsdienst. Im Impressum habe ich gelesen, dass eine Veröffentlichung oder Vervielfältigung Ihrer Inhalte Ihrer Einwilligung bedarf.

          Ich entwickle Jarvis, eine Cloud-Software für Unternehmen (https://app.wpdigitalranger.com). Für einen Tarifkatalog möchte ich ausgewählte Tabellenwerte strukturiert speichern und angemeldeten Firmenkunden anzeigen: Entgeltgruppe, Betrag, Gültigkeitsdatum und Geltungsbereich, jeweils mit Quellenlink und Prüfdatum. Jarvis ist für einen kommerziellen Einsatz vorgesehen.

          Wir würden weder PDF-Dateien noch längere Vertragstexte weiterveröffentlichen oder als Download anbieten. Bitte teilen Sie mir mit, ob das LfF diese Nutzung genehmigen kann, welche Bedingungen (z. B. Quellenangabe, Aktualisierung, Nutzungsentgelt) dafür gelten und ob hierfür Rechte Dritter eingeholt werden müssen. Falls Sie nicht zuständig sind, freue ich mich über den richtigen Kontakt.

          Vielen Dank

          Benjamin Schiffer
          WP Digital Ranger
          kontakt@wpdigitalranger.com
          https://wpdigitalranger.com
          """,
              ),
              (
                  "Tarifgemeinschaft deutscher Länder",
                  "info@tdl-online.de",
                  "Anfrage zur Nutzung ausgewählter TV-L-Entgeltdaten in Jarvis",
                  """Guten Tag,

          im TV-L-Bereich Ihrer Website werden die Tariftexte, Eingruppierung und Entgelttabellen veröffentlicht. Das Impressum weist darauf hin, dass die Vervielfältigung von Informationen oder Daten Ihrer vorherigen Zustimmung bedarf.

          Ich entwickle Jarvis, eine Cloud-Software für Unternehmen (https://app.wpdigitalranger.com). Für einen Tarifkatalog möchte ich ausgewählte TV-L-Tabellenwerte strukturiert speichern und angemeldeten Firmenkunden anzeigen: Entgeltgruppe, Betrag, Gültigkeitsdatum und Geltungsbereich, jeweils mit Quellenlink und Prüfdatum. Jarvis ist für einen kommerziellen Einsatz vorgesehen.

          Wir würden weder PDF-Dateien noch längere Vertragstexte weiterveröffentlichen oder als Download anbieten. Können Sie diese Nutzung genehmigen? Bitte nennen Sie gegebenenfalls Bedingungen wie Quellenangabe, erlaubten Umfang, Aktualisierung oder Nutzungsentgelt. Falls die Rechte bei den Tarifparteien gemeinsam oder bei einer anderen Stelle liegen, teilen Sie mir bitte mit, an wen ich mich wenden soll.

          Vielen Dank

          Benjamin Schiffer
          WP Digital Ranger
          kontakt@wpdigitalranger.com
          https://wpdigitalranger.com
          """,
              ),
              (
                  "IG Metall Bayern – Tarifteam",
                  "ralf.dirschl@igmetall.de",
                  "Anfrage zur Nutzung regionaler Metall-/Elektro-Entgeltdaten in Jarvis",
                  """Guten Tag Herr Dirschl,

          auf der Website der IG Metall sind Entgelttabellen der Metall- und Elektroindustrie mit regionalen Werten für Bayern und Baden-Württemberg veröffentlicht. Da ich keine offene Wiederverwendungslizenz gefunden habe, möchte ich vor einer Nutzung die Rechte klären.

          Ich entwickle Jarvis, eine Cloud-Software für Unternehmen (https://app.wpdigitalranger.com). Für einen Tarifkatalog möchte ich ausgewählte Tabellenwerte strukturiert speichern und angemeldeten Firmenkunden anzeigen: Entgeltgruppe, Betrag, Gültigkeitsdatum und Tarifregion, jeweils mit Quellenlink und Prüfdatum. Jarvis ist für einen kommerziellen Einsatz vorgesehen.

          Wir würden weder PDF-Dateien noch längere Vertragstexte weiterveröffentlichen oder als Download anbieten. Erteilt die IG Metall hierfür eine Genehmigung, und welche Bedingungen (z. B. Quellenangabe, Aktualisierung, Nutzungsentgelt) gelten? Umfasst Ihre Zuständigkeit die regionale Bayern-Tabelle und die BW-Werte der veröffentlichten Gesamttabelle? Falls eine andere Stelle die Rechte verwaltet, nennen Sie mir bitte den passenden Kontakt.

          Vielen Dank

          Benjamin Schiffer
          WP Digital Ranger
          kontakt@wpdigitalranger.com
          https://wpdigitalranger.com
          """,
              ),
          ]

          errors = []
          sent = 0
          with smtplib.SMTP_SSL("mail.privateemail.com", 465, timeout=30) as smtp:
              smtp.login("kontakt@wpdigitalranger.com", password)
              for label, recipient, subject, body in requests:
                  message = EmailMessage()
                  message["From"] = "Jarvis · WP Digital Ranger <kontakt@wpdigitalranger.com>"
                  message["To"] = recipient
                  message["Reply-To"] = "kontakt@wpdigitalranger.com"
                  message["Subject"] = subject
                  message.set_content(body)
                  try:
                      smtp.send_message(message)
                      sent += 1
                      print(f"Anfrage versendet: {label}")
                  except Exception as error:
                      errors.append((label, error))

          if errors:
              for label, error in errors:
                  print(f"Versandfehler {label}: {type(error).__name__}")
              raise SystemExit(f"{sent} von {len(requests)} Anfragen versendet")
          print(f"Alle {sent} Tarifrechte-Anfragen versendet")
          PY
