# Test: download the public documents of one tender (robots.txt respected) and add them to the PRIVATE test documents
# in R2 (testdaten/test-unterlagen.tar). Never commit them: this repo is public and portal terms usually forbid passing
# documents on. Check the portal's terms first (alarm/quellen.md).
name: Unterlagen testen

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link zur Unterlagen-Seite"
      name:
        description: "Ordnername"
        default: "test"

permissions:
  contents: read

jobs:
  laden:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/testunterlagen
      - env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
        run: python3 alarm/unterlagen.py "$URL" "$NAME"
      - name: Im privaten Speicher ablegen
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/test-unterlagen.tar" -C alarm/test-unterlagen .
          tar -tf "$RUNNER_TEMP/test-unterlagen.tar"
          cd web && npx wrangler r2 object put "jarvis-auftraege/testdaten/test-unterlagen.tar" --file "$RUNNER_TEMP/test-unterlagen.tar" --remote --jurisdiction eu --content-type application/x-tar
