# Read only: last AI requests (budget reservations) and firms whose company check is waiting.
name: Firmenprüfung Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Lesen
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cd alarm
          python - <<'PY'
          from profile_db import verbinden
          with verbinden() as c, c.cursor() as k:
              k.execute("set transaction read only")
              k.execute("select monat, reserviert, limit_usd from jarvis_katalog.ki_budget order by monat desc limit 2")
              print("BUDGET", k.fetchall())
              k.execute("select column_name from information_schema.columns where table_schema='jarvis_katalog' and table_name='ki_kosten'")
              spalten = [r[0] for r in k.fetchall()]
              print("SPALTEN", spalten)
              k.execute(f"select {', '.join(spalten)} from jarvis_katalog.ki_kosten order by zeit desc limit 25")
              for r in k.fetchall(): print("KI", r)
              k.execute("select f.name, s.einstellungen->>'recherche_fehler', s.einstellungen->>'recherche_website', s.einstellungen->>'recherche_wiederholen_ab', s.einstellungen->>'recherche_fehler_text', f.erstellt from public.suchprofile s join public.firmen f on f.id = s.firma_id where s.einstellungen->>'recherche_status' = 'wartet' order by f.erstellt desc limit 10")
              for r in k.fetchall(): print("WARTET", r)
              k.execute("""select f.name, f.id, f.erstellt, count(v.id),
                       count(*) filter (where v.steckbrief like '%# Steckbrief%'),
                       count(*) filter (where v.steckbrief like '%## Kurzüberblick%'),
                       round(avg(length(v.steckbrief))), max(v.erstellt)
                from public.firmen f left join public.vorgaenge v on v.firma_id = f.id
                group by f.id order by f.erstellt desc limit 8""")
              for r in k.fetchall(): print("FIRMA", r)
              # New logins of the last 14 days; e-mail shortened in the log (private data).
              k.execute("""select u.created_at, regexp_replace(u.email, '^(.).*(@.*)$', '\\1***\\2'), u.email_confirmed_at is not null,
                       coalesce(string_agg(f.name || ' (' || m.rolle || ')', ', '), '–')
                from auth.users u left join public.mitglieder m on m.user_id = u.id left join public.firmen f on f.id = m.firma_id
                where u.created_at > now() - interval '14 days' group by u.id order by u.created_at desc limit 30""")
              for r in k.fetchall(): print("NEU", r)
              k.execute("select count(*) from auth.users"); print("NUTZER GESAMT", k.fetchone()[0])
          PY
