# Checks the XRechnung export (web/src/xrechnung.ts) with the official KoSIT validator and the XRechnung configuration
# (both open source from github.com/itplr-kosit). Runs on changes to the export and on demand.
name: XRechnung prüfen
on:
  workflow_dispatch:
  push:
    paths: ["web/src/xrechnung.ts", "web/scripts/xrechnung-beispiel.ts", ".github/workflows/xrechnung-pruefen.yml"]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Beispielrechnungen erzeugen
        run: node --experimental-strip-types web/scripts/xrechnung-beispiel.ts regel.xml klein.xml 13b.xml storno.xml ausland.xml
      - name: KoSIT-Validator und XRechnung-Konfiguration laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lists the release files and picks the best package: a standalone jar, else a distribution zip, else any zip.
          asset() { curl -fsS --retry 4 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          namen = [a['name'] for a in d['assets']]
          print(d['tag_name'], namen, file=sys.stderr)
          def rang(n):
              n = n.lower()
              return 0 if n.endswith('.jar') and 'standalone' in n else 1 if n.endswith('.zip') and ('dist' in n or 'standalone' in n or 'xrechnung' in n) else 2 if n.endswith('.zip') and 'source' not in n and 'javadoc' not in n else 9
          beste = min(d['assets'], key=lambda a: rang(a['name']))
          print(beste['browser_download_url'])"; }
          holen() { u=$(asset "$1"); echo "$1 -> $u"; mkdir -p "$2"; case "$u" in
            *.jar) curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$2/$(basename "$u")" "$u" ;;
            *) curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$2.zip" "$u"; ls -la "$2.zip"; unzip -q -o "$2.zip" -d "$2" ;;
          esac; }
          holen itplr-kosit/validator validator
          holen itplr-kosit/validator-configuration-xrechnung konfig
          find validator -maxdepth 3 | head -30; find konfig -maxdepth 2 | head -20
      - name: Validieren
        run: |
          JAR=$(find validator -name "*standalone*.jar" | head -1)
          # Otherwise any jar with a start class in its manifest.
          [ -n "$JAR" ] || JAR=$(for j in $(find validator -name "*.jar"); do unzip -p "$j" META-INF/MANIFEST.MF 2>/dev/null | grep -q "^Main-Class" && echo "$j" && break; done)
          echo "Validator: $JAR"
          SZ=$(find konfig -name scenarios.xml | head -1)
          mkdir -p bericht
          if [ -n "$JAR" ]; then
            java -jar "$JAR" -s "$SZ" -r "$(dirname "$SZ")" -o bericht -h regel.xml klein.xml 13b.xml storno.xml ausland.xml || true
          else
            # Newer releases ship the validator jar plus its libraries: start the command line class via the classpath.
            CP=$(find validator -name "*.jar" | tr '\n' ':')
            java -cp "$CP" de.kosit.validationtool.cmd.CommandLineApplication -s "$SZ" -r "$(dirname "$SZ")" -o bericht -h regel.xml klein.xml 13b.xml storno.xml ausland.xml || true
          fi
          ls bericht
          ok=1
          for f in regel klein 13b storno ausland; do
            r=$(ls bericht/${f}-report.xml 2>/dev/null | head -1)
            if [ -z "$r" ]; then echo "$f: kein Bericht"; ok=0; continue; fi
            if grep -q "<rep:accept" "$r"; then echo "$f: AKZEPTIERT"; else echo "$f: ABGELEHNT"; ok=0; fi
            python3 - "$r" <<'PY'
          import re, sys
          t = open(sys.argv[1], encoding="utf-8").read()
          for m in re.finditer(r'<svrl:failed-assert[^>]*id="([^"]+)"[^>]*flag="([^"]+)"[\s\S]*?<svrl:text>([\s\S]*?)</svrl:text>', t):
              print(f"  {m.group(2)} {m.group(1)}: {' '.join(m.group(3).split())[:220]}")
          for m in re.finditer(r'<rep:message[^>]*level="(error|warning)"[^>]*>([\s\S]*?)</rep:message>', t):
              print(f"  {m.group(1)}: {' '.join(m.group(2).split())[:220]}")
          PY
          done
          [ $ok = 1 ]
