# Read-only check of national procurement sources for Austria (data.gv.at Kerndaten) and Switzerland (simap.ch):
# robots.txt, terms/legal pages and one sample request each. Saves nothing.
name: Österreich/Schweiz-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rechtstexte im Browser lesen
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cat > lesen.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch(); const p = await b.newPage({ userAgent: "JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)" });
          for (const u of ["https://www.simap.ch/de/about/legal", "https://www.data.gv.at/nutzungsbedingungen"]) {
            await p.goto(u, { waitUntil: "networkidle", timeout: 60000 }).catch(() => {});
            await p.waitForTimeout(3000);
            const t = (await p.evaluate(() => document.body.innerText)).replace(/\s+/g, " ");
            console.log("=== " + u + " (" + t.length + " Zeichen)"); console.log(t.slice(0, 6000));
          }
          await b.close();
          JS
          node lesen.mjs
      - name: Kerndaten-Quellen Österreich (Lizenz, Links)
        run: |
          curl -sL -m 30 -A "JarvisAlarm/0.1" "https://www.data.gv.at/api/hub/search/search?q=kerndaten&limit=60" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['result']; print('Treffer', d['count'])
          for r in d['results']:
              t=(r.get('title') or {}).get('de'); lic=[ (x.get('license') or {}).get('label') if isinstance(x.get('license'),dict) else x.get('license') for x in r.get('distributions') or []]
              urls=[x.get('access_url') or x.get('download_url') for x in r.get('distributions') or []]
              print('-', t, '|', lic[:1], '|', (urls[:1] or [''])[0])"
