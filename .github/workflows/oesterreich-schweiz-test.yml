# Read-only check of national procurement sources for Austria (data.gv.at Kerndaten) and Switzerland (simap.ch):
# robots.txt, terms/legal pages and one sample request each. Saves nothing.
name: Österreich/Schweiz-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots.txt
        run: |
          for u in https://www.simap.ch/robots.txt https://www.data.gv.at/robots.txt; do echo "=== $u"; curl -sL -m 20 -A "JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)" "$u" | head -60; echo; done
      - name: simap.ch Rechtliches und API
        run: |
          UA="JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)"
          echo "=== Links auf der Startseite (Recht/Nutzung/API)"
          curl -sL -m 20 -A "$UA" https://www.simap.ch/ | grep -oiE 'href="[^"]*(recht|nutzung|terms|agb|impressum|datenschutz|api|legal|disclaimer)[^"]*"' | sort -u | head -30
          for p in /api /api/publications/v2/project/project-search /api/publications/v1/project/project-search; do
            echo "=== GET $p"; curl -s -m 20 -A "$UA" -o /tmp/a -w "HTTP %{http_code} %{content_type}\n" "https://www.simap.ch$p"; head -c 800 /tmp/a; echo; done
      - name: data.gv.at Kerndaten
        run: |
          UA="JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)"
          for u in "https://www.data.gv.at/katalog/api/3/action/package_search?q=kerndaten&rows=3" "https://www.data.gv.at/katalog/api/3/action/package_search?fq=tags:bvergg&rows=3"; do
            echo "=== $u"; curl -sL -m 30 -A "$UA" "$u" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin)['result']; print('Treffer:', d['count'])
              for p in d['results'][:3]: print('-', p.get('title'), '|', p.get('license_title'), '|', [r.get('url') for r in p.get('resources',[])][:2])
          except Exception as e: print('Fehler', e)"; done
          echo "=== Nutzungsbedingungen data.gv.at"
          curl -sL -m 20 -A "$UA" https://www.data.gv.at/nutzungsbedingungen/ | python3 -c "import sys,re,html; t=re.sub(r'<[^>]+>',' ',sys.stdin.read()); t=html.unescape(re.sub(r'\s+',' ',t)); i=t.find('Nutzung'); print(t[i:i+2500])"
