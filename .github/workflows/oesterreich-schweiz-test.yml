# Read-only test of the Austrian source (alarm/oesterreich.py, Kerndaten via data.gv.at) for a given day.
# Prints counts and the first notices; saves nothing.
name: Österreich-Test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (JJJJ-MM-TT), leer = gestern"
        required: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kerndaten lesen
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(date -u -d yesterday +%F)
          python3 -u alarm/oesterreich.py "$TAG"
