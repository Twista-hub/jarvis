# Read-only check of national procurement sources for Austria (data.gv.at Kerndaten) and Switzerland (simap.ch):
# robots.txt, terms/legal pages and one sample request each. Saves nothing.
name: Österreich/Schweiz-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: simap.ch Rechtliches und Projektsuche
        run: |
          UA="JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)"
          echo "=== robots.txt vollständig (nur api/Allow-Zeilen)"; curl -sL -m 20 -A "$UA" https://www.simap.ch/robots.txt | grep -iE "api|allow:|sitemap|user-agent" | head -20
          for u in https://www.simap.ch/en/about/legal https://www.simap.ch/de/about/legal; do
            echo "=== $u"; curl -sL -m 20 -A "$UA" "$u" | python3 -c "import sys,re,html; t=sys.stdin.read(); print(len(t)); t=re.sub(r'<script.*?</script>',' ',t,flags=re.S); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t)); print(t[:3000])"; done
          for q in "lang=de" "lang=de&search=reinigung" "newestPublicationFrom=2026-11-01" "lang=de&newestPublicationFrom=2026-11-01&projectSubTypes=service"; do
            echo "=== project-search?$q"; curl -s -m 20 -A "$UA" -o /tmp/a -w "HTTP %{http_code}\n" "https://www.simap.ch/api/publications/v2/project/project-search?$q"; head -c 1500 /tmp/a; echo; done
      - name: data.gv.at neue Schnittstelle
        run: |
          UA="JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)"
          for u in "https://www.data.gv.at/api/hub/search/search?q=kerndaten&limit=3" "https://www.data.gv.at/api/hub/search/search?q=bvergg&limit=3" "https://data.gv.at/katalog/api/3/action/package_search?q=kerndaten&rows=3" "https://www.data.gv.at/katalog/dataset?q=kerndaten"; do
            echo "=== $u"; curl -sL -m 30 -A "$UA" -o /tmp/b -w "HTTP %{http_code} %{content_type}\n" "$u"; head -c 1200 /tmp/b; echo; done
          echo "=== Hinweise im App-Skript auf API-Pfade"
          js=$(curl -sL -m 20 -A "$UA" https://www.data.gv.at/ | grep -oE '/app\.[a-z0-9]+\.js' | head -1); echo "$js"
          curl -sL -m 30 -A "$UA" "https://www.data.gv.at$js" | grep -oE '"/api/[a-zA-Z0-9/_-]+' | sort -u | head -30
          echo "=== Nutzungsbedingungen/Impressum-Pfade"; curl -sL -m 30 -A "$UA" "https://www.data.gv.at$js" | grep -oiE '"/[a-z/-]*(nutzung|bedingung|impressum|lizenz|terms)[a-z/-]*"' | sort -u | head
