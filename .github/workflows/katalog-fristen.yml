# Fill missing deadlines in the catalog from the eForms exports (alarm/katalog_fristen.py). Public CC0 data only;
# firm records get only an empty deadline filled. "probe" counts without writing.
name: Katalog-Fristen
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "probe (nur zählen), schreiben oder stand (nur Datenbankgröße)"
        default: "probe"
permissions:
  contents: read
concurrency:
  group: katalog-fristen
jobs:
  fristen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Fristen nachtragen
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODUS: ${{ inputs.modus }}
        run: cd alarm && python katalog_fristen.py $(case "$MODUS" in schreiben) ;; stand) echo --stand ;; *) echo --probe ;; esac)
