# Fill missing deadlines in the catalog from the eForms exports (alarm/katalog_fristen.py). Public CC0 data only;
# firm records get only an empty deadline filled. "probe" counts without writing.
name: Katalog-Fristen
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "probe, schreiben, stand (Datenbankgröße), schlank-probe, schlank (Rohdaten alter Bekanntmachungen verkleinern), links-probe oder links (Suchlinks durch die Seite der Bekanntmachung ersetzen)"
        default: "probe"
permissions:
  contents: read
concurrency:
  group: katalog-fristen
jobs:
  fristen:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Fristen nachtragen
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODUS: ${{ inputs.modus }}
        run: |
          cd alarm
          case "$MODUS" in
            schlank) python katalog_schlank.py schreiben ;;
            schlank-probe) python katalog_schlank.py probe ;;
            schreiben) python katalog_fristen.py ;;
            links) python katalog_links.py ;;
            links-probe) python katalog_links.py --probe ;;
            stand) python katalog_fristen.py --stand ;;
            *) python katalog_fristen.py --probe ;;
          esac
