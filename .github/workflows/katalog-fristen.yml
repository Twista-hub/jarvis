# Fill missing deadlines in the catalog from the eForms exports (alarm/katalog_fristen.py). Public CC0 data only;
# firm records get only an empty deadline filled. "probe" counts without writing.
# Every Sunday night ("woche", Benjamin 24.11.2026): old notices are removed (alarm/katalog_aufraeumen.py, rule there),
# the raw data of closed or expired ones is shrunk and the freed space given back, so the catalogue stays below the
# limits at which the collector pauses (350 MB, 50,000 notices; it paused on 06.11. and 24.11.2026).
name: Katalog-Fristen
on:
  schedule:
    - cron: "43 2 * * 0"
  workflow_dispatch:
    inputs:
      modus:
        description: "probe, schreiben, stand (Datenbankgröße), schlank-probe, schlank (Rohdaten alter Bekanntmachungen verkleinern), aufraeumen-probe, aufraeumen (alte Bekanntmachungen entfernen), woche (aufraeumen + schlank), links-probe oder links (Suchlinks durch die Seite der Bekanntmachung ersetzen)"
        default: "probe"
permissions:
  contents: read
concurrency:
  group: katalog-fristen
jobs:
  fristen:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Fristen nachtragen
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODUS: ${{ github.event_name == 'schedule' && 'woche' || inputs.modus }}
        run: |
          cd alarm
          case "$MODUS" in
            woche) python katalog_aufraeumen.py schreiben && python katalog_schlank.py schreiben ;;
            aufraeumen) python katalog_aufraeumen.py schreiben ;;
            aufraeumen-probe) python katalog_aufraeumen.py probe ;;
            schlank) python katalog_schlank.py schreiben ;;
            schlank-probe) python katalog_schlank.py probe ;;
            schreiben) python katalog_fristen.py ;;
            links) python katalog_links.py ;;
            links-probe) python katalog_links.py --probe ;;
            stand) python katalog_fristen.py --stand ;;
            *) python katalog_fristen.py --probe ;;
          esac
