# Exploration for the tender alarm: public data only, no secrets.
name: Ausschreibungen erkunden

on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitraum in Tagen"
        default: "30"
      beispiel:
        description: "Nur ein Beispiel zeigen: Suchwort"
        default: ""
      portale:
        description: "Portale der Unterlagen zählen (ja)"
        default: ""
      zeiten:
        description: "Erreichbarkeit messen: URLs mit Leerzeichen (Status, Zeit, Größe)"
        default: ""
      pruefen:
        description: "Quellen prüfen: URLs mit Leerzeichen"
        default: ""
      zuschlaege:
        description: "Firma in deutschen Bekanntmachungen suchen (Tage = Zeitraum)"
        default: ""
      recherche:
        description: "Firma recherchieren: Suchbegriff | URL URL ..."
        default: ""
      foerder:
        description: "Förderdatenbank-Feed lesen und zeigen"
        type: boolean
        default: false
      seite:
        description: "Nur eine Seite als Text zeigen (z. B. Nutzungsbedingungen): URL"
        default: ""
      pdf:
        description: "Ein öffentliches PDF als Text zeigen (z. B. Tariftabelle), nur wenn robots.txt es erlaubt: URL"
        default: ""

jobs:
  erkunden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.portale != ''
        run: python3 alarm/portale.py "${{ inputs.tage }}"
      - if: inputs.zeiten != ''
        env:
          URLS: ${{ inputs.zeiten }}
        run: |
          for u in $URLS; do
            curl -s -o body.bin -m 60 -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" -w "%{http_code} %{time_total}s %{size_download}B  $u\n" "$u" || echo "FEHLER/TIMEOUT  $u"
            head -c 300 body.bin | tr -d '\0' ; echo; echo
          done
      - if: inputs.pruefen != ''
        env:
          URLS: ${{ inputs.pruefen }}
        run: python3 alarm/pruefen.py $URLS
      - if: inputs.foerder
        run: python3 alarm/foerder.py
      - if: inputs.recherche != ''
        env:
          RECHERCHE: ${{ inputs.recherche }}
        run: |
          begriff="${RECHERCHE%%|*}"; urls="${RECHERCHE#*|}"
          python3 alarm/recherche.py "$(echo $begriff)" $urls
      - if: inputs.zuschlaege != ''
        run: python3 alarm/zuschlaege.py "${{ inputs.zuschlaege }}" "${{ inputs.tage }}"
      - if: inputs.seite != ''
        env:
          SEITE: ${{ inputs.seite }}
        run: |
          curl -sSL -A "JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)" "$SEITE" -o seite.html
          python3 -c "import re,html;t=open('seite.html',errors='replace').read();t=re.sub(r'(?is)<(script|style).*?</\1>','',t);print(re.sub(r'\s*\n\s*','\n',html.unescape(re.sub(r'<[^>]+>','\n',t)))[:60000])"
          grep -oiE 'href="[^"]*(nutzung|agb|impressum|bedingung|terms)[^"]*"' seite.html | sort -u | head -40
      - if: inputs.pdf != ''
        env:
          PDF: ${{ inputs.pdf }}
        run: |
          python3 -c "import os,sys,urllib.parse,urllib.robotparser as r;u=os.environ['PDF'];p=urllib.parse.urlparse(u);rp=r.RobotFileParser(f'{p.scheme}://{p.netloc}/robots.txt');rp.read();ok=rp.can_fetch('JarvisAlarm',u);print('robots.txt erlaubt:',ok);sys.exit(0 if ok else 1)"
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sSL -A "JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)" "$PDF" -o datei.pdf
          pdftotext -layout datei.pdf - | head -c 60000
      - if: inputs.beispiel != '' && !inputs.foerder && inputs.recherche == '' && inputs.zuschlaege == '' && inputs.seite == '' && inputs.pdf == '' && inputs.portale == '' && inputs.pruefen == '' && inputs.zeiten == ''
        run: python3 alarm/beispiel.py "${{ inputs.beispiel }}" "${{ inputs.tage }}"
      - if: inputs.beispiel == '' && inputs.pdf == '' && inputs.seite == '' && inputs.portale == '' && inputs.pruefen == '' && inputs.zeiten == '' && !inputs.foerder && inputs.recherche == '' && inputs.zuschlaege == ''
        run: python3 alarm/erkunden.py "${{ inputs.tage }}"
      - if: inputs.beispiel == '' && inputs.pdf == '' && inputs.seite == '' && inputs.portale == '' && inputs.pruefen == '' && inputs.zeiten == '' && !inputs.foerder && inputs.recherche == '' && inputs.zuschlaege == ''
        run: python3 alarm/erkunden_de.py "${{ inputs.tage }}"
