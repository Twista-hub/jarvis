# Automatic posts on Bluesky and Mastodon (alarm/social.py), Monday to Friday about 09:00 Berlin. Two start times
# (07:05 and 08:05 UTC) cover summer and winter time; the script posts only between 09 and 11 Berlin and once per
# day and network. Secrets: BLUESKY_APP_PASSWORD, MASTODON_TOKEN (a network without its secret is skipped).
name: Social
on:
  schedule:
    - cron: "5 7 * * 1-5"
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      modus:
        description: "probe (nur Texte zeigen) oder posten"
        default: "probe"
permissions:
  contents: read
concurrency:
  group: social
jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Posten
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MODUS: ${{ inputs.modus || 'posten' }}
        run: cd alarm && python social.py "$MODUS"
