# Automatic posts on Bluesky and Mastodon (alarm/social.py): weekdays about 09, 13 and 17 Berlin, weekends about 11.
# One UTC start per slot (winter 09/13/17, summer 10/14/18 Berlin; the script's windows cover both) on an off-peak minute,
# plus a second start 30 minutes later in case GitHub drops a scheduled run (it dropped both starts on 07.11.2026); the
# script posts once per day, slot and network. Secrets: BLUESKY_APP_PASSWORD, MASTODON_TOKEN (a network without its
# secret is skipped).
name: Social
on:
  schedule:
    - cron: "23 8,12,16 * * 1-5"
    - cron: "53 8,12,16 * * 1-5"
    - cron: "23 10 * * 0,6"
    - cron: "53 10 * * 0,6"
  workflow_dispatch:
    inputs:
      modus:
        description: "probe (nur Texte zeigen), woche (Zahlen fürs Wochenpaket) oder posten"
        default: "probe"
permissions:
  contents: read
concurrency:
  group: social
jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Posten
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MODUS: ${{ inputs.modus || 'posten' }}
        run: cd alarm && python social.py "$MODUS"
