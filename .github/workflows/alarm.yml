# Daily tender report. Writes alarm/berichte/<date>.md; with the API key also KI scores and alarm/steckbriefe/.
# Since 03.11.2026 both live privately in R2 (.github/actions/alarmdaten), never in this public repo: they name
# customer firms, their hits and ratings.
name: Ausschreibungs-Alarm

on:
  schedule:
    # 04:17 UTC (05:17/06:17 Berlin): early enough for the Batch API (KI_BATCH below) before the first mails at 06:00 UTC.
    - cron: "17 4 * * *"
    # Backup: GitHub sometimes drops scheduled runs (30.10. no run at 05:17). Skips if the report exists.
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      tage:
        description: "Tage (YYYY-MM-DD, mit Leerzeichen); leer = gestern"
        default: ""
      firma:
        description: "Nur diese Firma (ID), z. B. direkt nach der Einrichtung; leer = alle. Ohne Tage: die letzten 7"
        default: ""

permissions:
  contents: read

concurrency:
  group: alarm-${{ inputs.firma || 'alle' }}
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Private Alarmdaten holen
        uses: ./.github/actions/alarmdaten
        with:
          richtung: holen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -q anthropic "psycopg[binary]" cryptography
      - name: Schon gelaufen?
        if: github.event_name == 'schedule'
        run: |
          if [ -f "alarm/berichte/$(date -u -d yesterday +%F).md" ]; then echo "SCHON=1" >> "$GITHUB_ENV"; echo "Bericht für gestern gibt es schon."; fi
      - id: suche
        if: env.SCHON != '1'
        run: python alarm/alarm.py ${{ inputs.tage }}
        env:
          FIRMA: ${{ inputs.firma }}
          # First run of a new firm: the best 10 hits get a detailed Steckbrief at once (Benjamin, 01.11.2026); daily runs 4.
          MAX_STECKBRIEFE: ${{ inputs.firma != '' && '10' || '4' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Batch API (50 % price, same quality: docs/ki-kosten.md) only for the scheduled daily run, never for a new
          # firm's first run where someone waits. At most 25 minutes per firm, then direct rating. Off: set '0'.
          KI_BATCH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          KI_BATCH_MINUTEN: "25"
          # US federal tenders (alarm/usa.py); empty = USA skipped.
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          # Reads the search profiles firms saved in the app (alarm/profile_db.py).
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Treffer in die App
        id: speichern
        if: env.SCHON != '1'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python alarm/speichern.py
      - name: Erste Treffer melden
        # Right after the setup assistant: mail and phone notification to the firm's people who want news.
        if: inputs.firma != ''
        continue-on-error: true
        env:
          FIRMA: ${{ inputs.firma }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python alarm/mail.py --sofort "$FIRMA"
      - name: Suchfehler anzeigen
        # Success and counts are saved atomically with the hits by speichern.py.
        if: always() && inputs.firma != '' && (steps.suche.outcome != 'success' || steps.speichern.outcome != 'success')
        continue-on-error: true
        env:
          FIRMA: ${{ inputs.firma }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cd alarm && python - <<'PY'
          import os
          from profile_db import verbinden
          with verbinden() as c:
              c.execute("update public.suchprofile set einstellungen = einstellungen || jsonb_build_object('erstlauf_fertig', now(), 'suchlauf_fehler', true) where firma_id = %s::uuid and bereich_id is null", (os.environ["FIRMA"],))
          print("Suchfehler als abgeschlossen markiert; bisherige Treffer bleiben erhalten.")
          PY
      - name: Datenbank wach halten
        # Free Supabase projects pause after 7 days without access; one query a day prevents that.
        continue-on-error: true
        env:
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["PW"],safe=""))')
          for host in aws-1-eu-central-1 aws-0-eu-central-1; do
            psql "postgresql://postgres.juuuifrcxmitkqudqngq:$pw@$host.pooler.supabase.com:5432/postgres" -tAc "select 'Datenbank wach: ' || count(*) || ' Firmen' from public.firmen" 2>/dev/null && break
          done
      - name: Bericht privat speichern
        if: always() && env.SCHON != '1' && steps.suche.outcome == 'success'
        uses: ./.github/actions/alarmdaten
        with:
          richtung: ablegen
