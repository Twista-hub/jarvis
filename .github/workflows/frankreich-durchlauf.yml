# Manual end-to-end check for a French firm (alarm/frankreich_durchlauf.py): real BOAMP data and real AI within the
# central budget, no account, nothing saved, no mail sent. Everything is printed into the log.
name: Länder-Durchlauf
on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Wie viele Tage zurück (1–10)"
        default: "4"
      land:
        description: "fr = Frankreich (BOAMP), pl = Polen (BZP), es = Spanien (Katalonien)"
        default: "fr"
permissions:
  contents: read
jobs:
  durchlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q anthropic "psycopg[binary]" cryptography
      - name: Testfirma Frankreich durchspielen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          KI_LIMIT_DOLLAR: "1"
          TAGE: ${{ inputs.tage || '4' }}
          LAND: ${{ inputs.land || 'fr' }}
        run: cd alarm && python frankreich_durchlauf.py "$TAGE" "$LAND"
