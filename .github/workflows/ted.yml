# Test the TED Search API (other European countries): prints the number of contract notices and samples.
name: Auslandsquellen testen (TED, Großbritannien, USA)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Veröffentlichungstag YYYY-MM-DD"
        required: true
      laender:
        description: "Länder (ISO3, mit Komma), z. B. AUT,NLD"
        default: "AUT,NLD,BEL,LUX,POL,CZE,FRA,DNK,CHE"
jobs:
  ted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 alarm/ted.py "${{ inputs.tag }}" "${{ inputs.laender }}"
      - name: Großbritannien (Find a Tender)
        run: python3 alarm/uk.py "${{ inputs.tag }}"
      - name: USA (SAM.gov, nur mit Schlüssel)
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: if [ -n "$SAM_API_KEY" ]; then python3 alarm/usa.py "${{ inputs.tag }}"; else echo "SAM_API_KEY fehlt noch."; fi
