# Read-only: Catalan open data portal (Socrata) – terms of use / licence text and the publication phases of dataset
# ybgg-dgi6 (public procurement publications). Nothing is stored.
name: Katalonien-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="JarvisAlarm/0.1 (WP Digital Ranger; kontakt@wpdigitalranger.com)"
          text() { python3 -c "
          import re,sys; t=open('p.html',errors='replace').read(); t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>','',t); t=re.sub(r'<[^>]+>',' ',t); t=re.sub(r'\s+',' ',t)
          for m in re.finditer(r'.{0,400}(llicència|licencia|reutilitz|comercial|atribuci|CC BY|Creative Commons).{0,400}', t, re.I): print('…', m.group(0)); print()" | head -30; }
          for u in https://analisi.transparenciacatalunya.cat/stories/s/Condicions-d-%C3%BAs/yb9e-2f9y https://administraciodigital.gencat.cat/ca/dades/dades-obertes/informacio-practica/llicencies/ https://governobert.gencat.cat/ca/dades_obertes/llicencia/ https://web.gencat.cat/ca/menu-ajuda/ajuda/avis_legal/; do
            echo "===== $u"; curl -sSL -m 30 -A "$UA" -o p.html -w "HTTP %{http_code}\n" "$u" && text
          done
          echo "===== Phasen"; curl -sS -m 30 -A "$UA" "https://analisi.transparenciacatalunya.cat/resource/ybgg-dgi6.json?\$select=fase_publicacio,count(*)&\$group=fase_publicacio&\$where=data_publicacio_anunci%3E'2026-10-25T00:00:00'"; echo
          echo "===== Anuncis gestern"; D=$(date -u -d yesterday +%F)
          curl -sS -m 30 -A "$UA" "https://analisi.transparenciacatalunya.cat/resource/ybgg-dgi6.json?\$select=count(*)&\$where=data_publicacio_anunci%3E='${D}T00:00:00'%20AND%20data_publicacio_anunci%3C'${D}T23:59:59'"; echo
          curl -sS -m 30 -A "$UA" "https://analisi.transparenciacatalunya.cat/resource/ybgg-dgi6.json?\$limit=1&\$where=fase_publicacio='Anunci%20de%20licitació'&\$order=data_publicacio_anunci%20DESC" | head -c 2500; echo
